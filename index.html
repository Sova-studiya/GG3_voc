<title>Go Getter 3 — словарь</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#16233b;--mut:#5d6b85;--acc:#2f6bff;--ok:#1f9d55;--bad:#d64545;--line:#d9e1ef;--sun:#ffc533;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#19233a;--ink:#eaf0ff;--mut:#9fb0d0;--acc:#6b95ff;--ok:#43c47c;--bad:#ff7070;--line:#2c3a58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#19233a;--ink:#eaf0ff;--mut:#9fb0d0;--acc:#6b95ff;--ok:#43c47c;--bad:#ff7070;--line:#2c3a58;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Nunito","Trebuchet MS",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.25rem;margin:1.2em 0 .5em}
.sub{color:var(--mut);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.b{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.b:hover,.b:focus-visible{border-color:var(--acc);outline:none}
.b small{display:block;color:var(--mut)}
.mix{background:var(--sun);color:#3a2a00;border:0;font-weight:800;font-size:1.1rem;text-align:center;border-radius:16px;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:none;border:0;font-size:1rem;color:var(--acc);font-weight:700;padding:6px 0}
.bar{height:8px;background:var(--line);border-radius:6px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;margin-bottom:12px;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.q .big{font-size:1.9rem;font-weight:800}.q .tr{color:var(--mut)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.o{font-size:.95rem;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;font-weight:700;text-align:center}
.o.ok,.t.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.spk{background:var(--acc);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:1.3rem;flex:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px;margin:6px 0}
.s,.t{min-width:42px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:1.3rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.s{border-style:dashed}.t:disabled{opacity:.3}
.inp{width:100%;font:inherit;font-size:1.4rem;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.go{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:800;margin-top:10px}
.msg{min-height:1.5em;text-align:center;font-weight:700;margin-top:8px}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line)}
.fc{perspective:900px;height:200px;margin-bottom:12px}
.fc div{height:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;font-weight:800;cursor:pointer;gap:6px}
.row{display:flex;gap:10px}.row button{flex:1}
.star{font-size:2.4rem;letter-spacing:4px}
</style></head><body><div id="app"></div>

const norm=s=>s.toLowerCase().replace(/[^a-zа-яé]/g,'');
function distract(w,n){const pool=sh(MODS[w.m].words.filter(x=>x.w!==w.w)).concat(sh(ALL.filter(x=>x.m!==w.m)));return pool.slice(0,n)}
const LV=["Словарик","Слово → перевод","Перевод → слово","Слушай перевод","Пропущенная буква","Собери слово","Диктант"];
function home(){
 let h='<h1>Go Getter 3</h1><p class="sub">Выбери раздел и тренируйся</p><button class="b mix" id="mix">🎲 Микс: 30 слов (выбрать разделы)</button>';
 D.forEach((u,i)=>{h+='<h2>'+u.n+'</h2><div class="grid">'+u.m.map(m=>'<button class="b" data-m="'+m.id+'"><b>'+m.id+' '+m.t+'</b><small>'+m.words.length+' слов</small></button>').join('')+'</div>'});
 app.innerHTML=h;document.getElementById('mix').onclick=mixSetup;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>mod(b.dataset.m));
}
function mod(id){
 const m=MODS[id];
 app.innerHTML='<button class="back" id="bk">‹ Назад</button><h1>'+id+' '+m.t+'</h1><p class="sub">7 уровней тренировки</p><div class="grid">'+LV.map((l,i)=>'<button class="b" data-l="'+i+'"><b>Уровень '+(i+1)+'</b><small>'+l+'</small></button>').join('')+'</div>';
 document.getElementById('bk').onclick=home;
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>b.dataset.l==0?list(id):play(id,+b.dataset.l));
}
function list(id){
 const m=MODS[id];
 app.innerHTML='<button class="back" id="bk">‹ Назад</button><h1>'+m.t+'</h1><table>'+m.words.map((w,i)=>'<tr><td><b>'+w.w+'</b><br><small style="color:var(--mut)">'+w.p+'</small></td><td>'+w.d+'</td><td><button class="spk" data-i="'+i+'" aria-label="Озвучить">🔊</button></td></tr>').join('')+'</table>';
 document.getElementById('bk').onclick=()=>mod(id);
 app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>say(m.words[b.dataset.i].w));
}
function choice(box,opts,right,cb,key){
 box.innerHTML='<div class="opts">'+opts.map(o=>'<button class="o">'+o[key]+'</button>').join('')+'</div>';
 const bs=[...box.querySelectorAll('.o')];
 bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.disabled=true);const ok=opts[i]===right;b.classList.add(ok?'ok':'no');if(!ok)bs[opts.indexOf(right)].classList.add('ok');cb(ok)});
}
const L=[null,
(w,q,a,cb)=>{q.innerHTML='<div class="big">'+w.w+'</div><div class="tr">'+w.p+'</div>';say(w.w);choice(a,sh([w,...distract(w,3)]),w,cb,'d')},
(w,q,a,cb)=>{q.innerHTML='<div class="big">'+w.d+'</div>';choice(a,sh([w,...distract(w,3)]),w,cb,'w')},
(w,q,a,cb)=>{q.innerHTML='<button class="spk" id="sp" aria-label="Послушать">🔊</button><div class="tr">Что это за слово?</div>';const go=()=>sayD(w);q.querySelector('#sp').onclick=go;go();choice(a,sh([w,...distract(w,3)]),w,cb,'w')},
(w,q,a,cb)=>{const cs=[...w.w];const idx=sh(cs.map((c,i)=>/[a-zé]/i.test(c)?i:-1).filter(i=>i>=0))[0];const r=cs[idx].toLowerCase();
 q.innerHTML='<div class="tr">'+w.d+'</div><div class="big">'+cs.map((c,i)=>i===idx?'_':c).join('')+'</div>';
 const ls=new Set([r]);while(ls.size<4)ls.add('abcdefghijklmnoprstuwy'[Math.floor(Math.random()*22)]);
 choice(a,sh([...ls]).map(x=>({l:x,r:x===r})),null,ok=>cb(ok),'l');
 const bs=[...a.querySelectorAll('.o')],ls2=[...ls];
 bs.forEach(b=>{b.onclick=null;b.disabled=false;b.onclick=()=>{bs.forEach(x=>x.disabled=true);const ok=b.textContent===r;b.classList.add(ok?'ok':'no');if(!ok)bs.find(x=>x.textContent===r).classList.add('ok');q.querySelector('.big').textContent=w.w;cb(ok)}});},
(w,q,a,cb)=>{const cs=[...w.w.replace(/ /g,'')];let cur=[];q.innerHTML='<div class="tr">'+w.d+'</div><div class="slots" id="sl"></div>';
 a.innerHTML='<div class="slots" id="tl"></div>';const sl=q.querySelector('#sl'),tl=a.querySelector('#tl');
 const tiles=sh(cs.map((c,i)=>({c,i})));
 const draw=()=>{sl.innerHTML=cs.map((_,i)=>'<button class="s" data-p="'+i+'">'+(cur[i]?cur[i].c:'')+'</button>').join('');
  sl.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(done)return;if(cur[b.dataset.p]){cur.splice(b.dataset.p,1);draw()}});
  tl.innerHTML=tiles.map(t=>'<button class="t" data-i="'+t.i+'" '+(cur.includes(t)?'disabled':'')+'>'+t.c+'</button>').join('');
  tl.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(done)return;cur.push(tiles.find(t=>t.i==b.dataset.i));draw();
   if(cur.length===cs.length){done=true;const ok=cur.map(t=>t.c).join('').toLowerCase()===cs.join('').toLowerCase();sl.querySelectorAll('.s').forEach(s=>s.classList.add(ok?'ok':'no'));if(!ok)sl.insertAdjacentHTML('afterend','<div class="msg">'+w.w+'</div>');cb(ok)}})};
 let done=false;draw()},
(w,q,a,cb)=>{q.innerHTML='<button class="spk" id="sp" aria-label="Послушать">🔊</button><div class="tr">Напиши, что услышал</div>';
 const go=()=>say(w.w);q.querySelector('#sp').onclick=go;setTimeout(go,300);
 a.innerHTML='<input class="inp" id="in" autocomplete="off" autocapitalize="none" spellcheck="false"><div style="text-align:center"><button class="go" id="ck">Проверить</button></div><div class="msg" id="ms"></div>';
 const inp=a.querySelector('#in'),ck=a.querySelector('#ck');let done=false;
 const chk=()=>{if(done)return;done=true;const ok=norm(inp.value)===norm(w.w);inp.style.borderColor=ok?'var(--ok)':'var(--bad)';a.querySelector('#ms').textContent=ok?'Верно!':'Правильно: '+w.w;cb(ok)};
 ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};inp.focus()}
];
function play(id,lv,items,back){
 const m=MODS[id];items=sh(m.words).slice(0,10);back=()=>mod(id);let i=0,sc=0;
 const step=()=>{
  if(i>=items.length)return fin();
  app.innerHTML='<div class="top"><button class="back" id="bk">‹</button><div class="bar"><i style="width:'+(i/items.length*100)+'%"></i></div><b>'+sc+'/'+items.length+'</b></div><div class="q" id="q"></div><div id="a"></div>';
  document.getElementById('bk').onclick=back;
  L[lv](items[i],document.getElementById('q'),document.getElementById('a'),ok=>{if(ok)sc++;i++;setTimeout(step,ok?800:1700)});
 };
 const fin=()=>{const p=sc/items.length,st=p>=.9?3:p>=.6?2:p>=.3?1:0;
  app.innerHTML='<div class="q"><div class="star">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div><div class="big">'+sc+' из '+items.length+'</div></div><div class="row"><button class="go" id="re">Ещё раз</button><button class="go" id="bk">К уровням</button></div>';
  document.getElementById('re').onclick=()=>play(id,lv);document.getElementById('bk').onclick=back};
 step();
}
let RNG=null;const ORDER=D.flatMap(u=>u.m.map(m=>m.id));
function mixSetup(){
 const opt=sel=>ORDER.map((id,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>'+id+' '+MODS[id].t+'</option>').join('');
 app.innerHTML='<button class="back" id="bk">‹ Назад</button><h1>🎲 Микс</h1><p class="sub">30 случайных слов из выбранных разделов. Выбери, с какого и по какой раздел вы прошли.</p><label>От раздела<select id="f" class="inp" style="font-size:1rem">'+opt(RNG?RNG[0]:0)+'</select></label><br><br><label>До раздела<select id="t" class="inp" style="font-size:1rem">'+opt(RNG?RNG[1]:ORDER.length-1)+'</select></label><p class="sub" id="cnt"></p><button class="go" id="st">Начать</button>';
 const f=document.getElementById('f'),t=document.getElementById('t'),c=document.getElementById('cnt');
 const upd=()=>{let a=+f.value,b=+t.value;if(a>b)[a,b]=[b,a];const n=ALL.filter(w=>{const i=ORDER.indexOf(w.m);return i>=a&&i<=b}).length;c.textContent='Слов в выбранном диапазоне: '+n;return[a,b]};
 f.onchange=t.onchange=upd;upd();
 document.getElementById('bk').onclick=home;
 document.getElementById('st').onclick=()=>{RNG=upd();mix()};
}
function mix(){
 const pool=RNG?ALL.filter(w=>{const k=ORDER.indexOf(w.m);return k>=RNG[0]&&k<=RNG[1]}):ALL;const items=sh(pool).slice(0,30);let i=0,known=0,flip=false;
 const step=()=>{
  if(i>=items.length){app.innerHTML='<div class="q"><div class="big">Знаешь '+known+' из '+items.length+'</div></div><div class="row"><button class="go" id="re">Новый микс</button><button class="go" id="bk">В меню</button></div>';
   document.getElementById('re').onclick=mix;document.getElementById('bk').onclick=home;return}
  const w=items[i];flip=false;
  app.innerHTML='<div class="top"><button class="back" id="bk">‹</button><div class="bar"><i style="width:'+(i/items.length*100)+'%"></i></div><b>'+(i+1)+'/'+items.length+'</b></div><div class="fc"><div id="c"><span>'+w.w+'</span><small style="font-size:1rem;color:var(--mut)">'+w.p+'</small><small style="font-size:.85rem;color:var(--mut)">нажми, чтобы перевернуть</small></div></div><div class="row"><button class="go" id="no" style="background:var(--bad)">Учить</button><button class="spk" id="sp" style="align-self:end">🔊</button><button class="go" id="yes" style="background:var(--ok)">Знаю</button></div>';
  document.getElementById('bk').onclick=home;
  document.getElementById('c').onclick=()=>{flip=!flip;document.getElementById('c').innerHTML=(flip?'<span style="font-size:1.3rem;padding:0 14px;text-align:center">'+w.d+'</span>':'<span>'+w.w+'</span><small style="font-size:1rem;color:var(--mut)">'+w.p+'</small>');if(!flip)say(w.w)};
  document.getElementById('sp').onclick=()=>say(w.w);
  document.getElementById('yes').onclick=()=>{known++;i++;step()};document.getElementById('no').onclick=()=>{i++;step()};
 };step();
}
home();
</script></body></html>
